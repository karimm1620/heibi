// Checkpoint 4c: Widget 1 (Heatmap) pindah ke Jetpack Glance, yang butuh
// Compose Compiler Gradle plugin. Versinya HARUS sama persis kayak versi
// Kotlin project ini (2.0.21 -- default dari `ExpoModulesCorePlugin.gradle`
// di bawah, lihat `project.ext.kotlinVersion()` di situ). Kalau project
// upgrade versi Kotlin, baris classpath ini WAJIB ikut di-update ke versi
// yang sama persis, atau build bakal gagal (compiler mismatch).
buildscript {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.0.21"
  }
}

apply plugin: 'com.android.library'

group = 'expo.modules.homewidgets'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
// Compose Compiler plugin butuh kotlin-android (di-apply barusan sama baris
// di atas) udah ke-apply duluan.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.homewidgets"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Widget 1 (Heatmap) -- checkpoint 4c. Widget 2 masih RemoteViews klasik
  // (checkpoint 4d migrasi ke Glance juga, dependency ini bakal kepake
  // bareng).
  implementation "androidx.glance:glance-appwidget:1.1.1"
}
